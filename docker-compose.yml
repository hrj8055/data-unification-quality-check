services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/duplicate-check
    volumes:
      - ./data:/app/data
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:1.64.0
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
